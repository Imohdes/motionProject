  <style>
/* =========================================================
   «خريطة لقاءات» – 1920×1080 design stage
   ========================================================= */
:root {
  --blue: #005688;
  --green: #03A76A;
  --orange: #DC7B2C;
  --navy: #041B30;

  --green-glow: #19d48f;
  --sky: #4fc3f7;
  --sky-soft: rgba(79, 195, 247, .35);
  --card-line: rgba(94, 170, 225, .28);
  --card-bg: linear-gradient(180deg, rgba(14, 44, 74, .62), rgba(6, 26, 46, .72));
  --text: #ffffff;
  --text-dim: rgba(222, 236, 250, .86);

  --font: "SST Arabic", "Segoe UI", Tahoma, sans-serif;
  --ease: cubic-bezier(.22, .7, .2, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: #020d18;
  overflow: hidden;
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }

/* ---------- Stage scaling ---------- */
.viewport {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  transform: translate(-50%, -50%) scale(var(--scale, 1));
  transform-origin: 50% 50%;
  overflow: hidden;
  background: var(--navy);
}

/* ---------- Background ---------- */
.bg, .bg > * { position: absolute; inset: 0; pointer-events: none; }
.bg__base {
  background:
    radial-gradient(1200px 520px at 62% 8%, rgba(30, 72, 120, .55), transparent 70%),
    radial-gradient(900px 700px at 28% 55%, rgba(10, 52, 92, .55), transparent 70%),
    radial-gradient(700px 500px at 80% 70%, rgba(6, 40, 70, .5), transparent 70%),
    linear-gradient(180deg, #0a2440 0%, #061d35 38%, #041a2e 70%, #03131f 100%);
}
.bg__terrain {
  /* dark relief around the peninsula (sea / neighbouring land) */
  background:
    radial-gradient(520px 260px at 6% 72%, rgba(4, 18, 32, .9), transparent 70%),
    radial-gradient(640px 300px at 52% 20%, rgba(18, 48, 80, .55), transparent 70%),
    radial-gradient(420px 200px at 2% 30%, rgba(20, 52, 86, .45), transparent 70%),
    radial-gradient(900px 260px at 40% 98%, rgba(2, 12, 22, .9), transparent 70%);
}
.bg__lights { width: 1920px; height: 1080px; opacity: .9; }
.bg__skyline {
  inset: auto;
  left: 643px; top: 121px; width: 844px; height: 133px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18%, #000 80%, transparent 100%), linear-gradient(180deg, transparent 0, #000 35%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(90deg, transparent 0, #000 18%, #000 80%, transparent 100%), linear-gradient(180deg, transparent 0, #000 35%);
  mask-composite: intersect;
  opacity: .92;
}
.bg__skyline img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bg__drift {
  background:
    radial-gradient(420px 260px at 30% 40%, rgba(64, 160, 255, .12), transparent 70%),
    radial-gradient(360px 240px at 70% 30%, rgba(3, 167, 106, .07), transparent 70%);
  animation: drift 26s ease-in-out infinite alternate;
  mix-blend-mode: screen;
}
@keyframes drift {
  0% { transform: translate3d(-40px, 10px, 0); opacity: .7; }
  50% { transform: translate3d(30px, -20px, 0); opacity: 1; }
  100% { transform: translate3d(60px, 20px, 0); opacity: .75; }
}
.bg__streak {
  inset: auto;
  height: 3px;
  border-radius: 3px;
  transform-origin: 0 50%;
  filter: blur(.6px);
}
.bg__streak::after {
  content: ""; position: absolute; inset: -6px 0;
  background: inherit; filter: blur(8px); opacity: .8;
}
.bg__streak--orange {
  left: -20px; top: 780px; width: 380px;
  background: linear-gradient(90deg, rgba(255, 150, 60, 0), rgba(255, 160, 70, .95) 45%, rgba(255, 140, 50, 0));
  transform: rotate(16deg);
  animation: streak 7s ease-in-out infinite;
}
.bg__streak--blue {
  left: -20px; top: 848px; width: 360px;
  background: linear-gradient(90deg, rgba(40, 160, 255, 0), rgba(60, 180, 255, .9) 50%, rgba(40, 160, 255, 0));
  transform: rotate(18deg);
  animation: streak 9s ease-in-out infinite reverse;
}
.bg__streak--blue2 {
  left: 690px; top: 948px; width: 340px; height: 2px;
  background: linear-gradient(90deg, rgba(40, 160, 255, 0), rgba(90, 200, 255, .8) 50%, rgba(40, 160, 255, 0));
  transform: rotate(-4deg);
  animation: streak 11s ease-in-out infinite;
}
@keyframes streak { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.bg__horizon {
  inset: auto; left: 0; right: 0; top: 952px; height: 2px;
  background: linear-gradient(90deg, rgba(60, 170, 255, 0), rgba(70, 180, 255, .55) 20%, rgba(70, 180, 255, .25) 60%, rgba(70, 180, 255, 0));
  box-shadow: 0 0 18px 2px rgba(50, 150, 255, .35);
}
.bg__vignette {
  background: radial-gradient(1400px 900px at 50% 45%, transparent 55%, rgba(0, 6, 14, .7) 100%);
}

/* ---------- Brand / heading ---------- */
.brand { position: absolute; left: 70px; top: 26px; }
.brand__logo { display: block; width: 314px; height: auto; }

.heading {
  position: absolute;
  left: 76px; right: auto; top: 52px;
  text-align: left;
}
.heading__title {
  margin: 0;
  font-size: 48px;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: 0;
  text-shadow: 0 2px 18px rgba(0, 0, 0, .35);
}
.heading__sub {
  margin: 14px 0 0;
  font-size: 21px;
  font-weight: 400;
  color: var(--text-dim);
}
.heading__line {
  display: block;
  margin: 20px 0 0 auto;
  width: 166px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, #2c8fe0 0 34%, var(--green) 34% 66%, var(--orange) 66% 100%);
  box-shadow: 0 0 10px rgba(60, 160, 255, .35);
}

/* Full-screen toggle */
.fs-btn {
  position: absolute; left: 18px; top: 18px;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 10px;
  border: 1px solid rgba(110, 190, 255, .25);
  background: rgba(6, 28, 50, .45);
  color: #bfe6ff;
  opacity: .25;
  cursor: pointer;
  transition: opacity .3s, border-color .3s;
  z-index: 30;
}
.fs-btn:hover, .fs-btn:focus-visible { opacity: 1; border-color: var(--sky); outline: none; }
.fs-btn .icon { width: 20px; height: 20px; }

/* ---------- Map ---------- */
.map {
  position: absolute;
  left: 112px; top: 168px;
  width: 940px; height: 790px;
  perspective: 1900px;
  perspective-origin: 50% 0%;
}
.map__tilt {
  position: absolute; inset: 0;
  transform: rotateX(19deg) scale(1.03);
  transform-origin: 50% 60%;
  transform-style: preserve-3d;
}
.map__svg {
  position: absolute;
  left: 20px; top: 8px;
  width: 900px; height: 739px;
  overflow: visible;
  direction: ltr; /* geography is never mirrored in RTL */
}

.region {
  cursor: pointer;
  stroke: rgba(120, 205, 255, .62);
  stroke-width: 1.15;
  stroke-linejoin: round;
  transition: fill .6s var(--ease), stroke .4s var(--ease), filter .4s var(--ease);
  outline: none;
}
.region:hover, .region.is-hover { stroke: #aee8ff; stroke-width: 1.6; filter: brightness(1.18); }
.region:focus-visible { stroke: #fff; stroke-width: 2; }
.region.is-active { fill: url(#gradActive) !important; stroke: transparent; filter: none; }

.map-glow-active {
  fill: none;
  stroke: #3dfcb4;
  stroke-width: 2.2;
  stroke-linejoin: round;
  filter: url(#fGlowGreen);
  pointer-events: none;
  opacity: 0;
  transition: opacity .5s var(--ease);
}
.map-glow-active.is-on { opacity: 1; }
.map-glow-hover {
  fill: rgba(140, 220, 255, .06);
  stroke: #9fe4ff;
  stroke-width: 1.8;
  filter: url(#fGlowSky);
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
}
.map-glow-hover.is-on { opacity: 1; }

.outline-pulse { animation: outlinePulse 5s ease-in-out infinite; }
@keyframes outlinePulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }

.map-label { cursor: pointer; }
.map-label text {
  font-family: var(--font);
  font-size: 17px;
  font-weight: 600;
  fill: #fff;
  text-anchor: middle;
  paint-order: stroke;
  stroke: rgba(3, 18, 34, .55);
  stroke-width: 3px;
  transition: font-size .45s var(--ease);
}
.map-label .pin { color: #bfe9ff; transition: transform .45s var(--ease), color .45s; }
.map-label.is-active text { font-size: 23px; font-weight: 700; }
.map-label.is-active .pin { color: #3dfcb4; filter: url(#fGlowGreen); }
.map-label:hover text { fill: #e6f8ff; }

/* ---------- Info panel ---------- */
.panel {
  position: absolute;
  left: 1054px; top: 255px;
  width: 830px; height: 693px;
  border-radius: 18px;
  border: 1px solid rgba(96, 170, 230, .32);
  background: linear-gradient(180deg, rgba(8, 32, 56, .82), rgba(5, 24, 42, .9));
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(160, 215, 255, .08);
  backdrop-filter: blur(6px);
  overflow: hidden;
}
.panel__header { position: absolute; inset: 0 0 auto 0; height: 140px; }
.panel__sky {
  position: absolute; right: 0; top: 0; width: 552px; height: 132px;
  background: radial-gradient(420px 120px at 75% 70%, rgba(80, 110, 170, .18), transparent 70%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 34%), linear-gradient(180deg, #000 70%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(90deg, transparent 0, #000 34%), linear-gradient(180deg, #000 70%, transparent 100%);
  mask-composite: intersect;
  transition: opacity .6s var(--ease);
}
.panel__sky img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  animation: fadeIn .7s var(--ease) both;
}
.panel__title-wrap {
  position: absolute; left: 32px; top: 26px;
  display: flex; align-items: center; gap: 14px;
  direction: rtl;
  flex-direction: row-reverse;
}
.panel__title {
  margin: 0;
  font-size: 38px; font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 2px 14px rgba(0, 0, 0, .5);
}
.panel__pin { color: var(--green-glow); display: grid; filter: drop-shadow(0 0 8px rgba(25, 212, 143, .55)); }
.panel__pin .icon { width: 34px; height: 34px; stroke-width: 2; }
.panel__underline { position: absolute; left: 32px; top: 87px; display: flex; gap: 14px; align-items: center; }
.panel__underline i { width: 16px; height: 3px; border-radius: 2px; background: rgba(3, 167, 106, .55); }
.panel__underline b { width: 54px; height: 3px; border-radius: 2px; background: var(--green-glow); box-shadow: 0 0 10px rgba(25, 212, 143, .7); }
.panel__demo {
  position: absolute; left: 32px; top: 100px; margin: 0;
  font-size: 12.5px; color: rgba(200, 225, 245, .62);
  letter-spacing: 0;
}

/* Stat cards */
.stats {
  position: absolute; left: 21px; right: 21px; top: 138px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;
  direction: ltr; /* order left→right exactly as the reference */
}
.stat {
  position: relative;
  height: 202px;
  border-radius: 14px;
  border: 1px solid var(--card-line);
  background: var(--card-bg);
  box-shadow: inset 0 1px 0 rgba(170, 220, 255, .07), 0 10px 30px rgba(0, 0, 0, .25);
  backdrop-filter: blur(4px);
  display: flex; flex-direction: column; align-items: center;
  direction: rtl;
  transition: transform .35s var(--ease), border-color .35s, box-shadow .35s;
}
.stat:hover { transform: translateY(-3px); border-color: rgba(120, 200, 255, .5); box-shadow: inset 0 1px 0 rgba(170, 220, 255, .1), 0 16px 34px rgba(0, 0, 0, .35); }
.stat__icon { margin-top: 26px; display: grid; }
.stat__icon .icon { width: 44px; height: 44px; stroke-width: 1.7; }
.stat__label { margin: 22px 0 0; font-size: 20px; font-weight: 500; color: var(--text-dim); }
.stat__value {
  margin-top: 6px;
  font-size: 44px; font-weight: 700; line-height: 1.15;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  letter-spacing: .5px;
}
.stat__bar { margin-top: 14px; width: 54px; height: 3px; border-radius: 2px; }
.stat--green .stat__icon { color: #1fd394; filter: drop-shadow(0 0 6px rgba(31, 211, 148, .35)); }
.stat--green .stat__bar { background: #1fc98c; box-shadow: 0 0 10px rgba(31, 211, 148, .7); }
.stat--blue .stat__icon { color: #3aa8ff; filter: drop-shadow(0 0 6px rgba(58, 168, 255, .35)); }
.stat--blue .stat__bar { background: #2f9cff; box-shadow: 0 0 10px rgba(47, 156, 255, .7); }
.stat--orange .stat__icon { color: #f0913a; filter: drop-shadow(0 0 6px rgba(240, 145, 58, .35)); }
.stat--orange .stat__bar { background: #ec8b33; box-shadow: 0 0 10px rgba(236, 139, 51, .7); }

.panel__tick {
  position: absolute; right: 26px; top: 353px; width: 44px; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(80, 190, 255, .6));
}

.section-title {
  position: absolute; right: 25px; margin: 0;
  font-size: 19px; font-weight: 500; color: #eaf5ff;
}
.section-title--sectors { top: 362px; }
.section-title--venues { top: 504px; font-weight: 700; }

/* Sectors */
.sectors {
  position: absolute; left: 24px; right: 24px; top: 404px; height: 80px;
  display: flex; gap: 9px;
  direction: ltr; /* data order = left→right, exactly as the reference */
}
.sector {
  flex: 1 1 0;
  min-width: 0;
  border-radius: 10px;
  border: 1px solid rgba(94, 170, 225, .22);
  background: linear-gradient(180deg, rgba(14, 46, 78, .55), rgba(7, 28, 50, .65));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  transition: transform .3s var(--ease), border-color .3s, background .3s;
}
.sector:hover { transform: translateY(-2px); border-color: rgba(120, 200, 255, .5); background: linear-gradient(180deg, rgba(18, 58, 96, .65), rgba(8, 32, 58, .7)); }
.sector .icon { width: 32px; height: 32px; color: #5bb8ff; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(91, 184, 255, .35)); }
.sector span { direction: rtl; }
.sector span { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 96%; }

.panel__divider {
  position: absolute; left: 24px; right: 24px; top: 494px; margin: 0;
  border: 0; height: 1px;
  background: linear-gradient(90deg, rgba(80, 160, 230, .05), rgba(80, 160, 230, .35), rgba(80, 160, 230, .05));
}

/* Venues */
.venues {
  position: absolute; left: 24px; right: 24px; top: 543px; height: 128px;
  display: flex; gap: 10px;
}
.venue {
  flex: 1 1 0; min-width: 0;
  border-radius: 10px; overflow: hidden;
  border: 1px solid rgba(94, 170, 225, .2);
  background: rgba(8, 30, 52, .75);
  display: flex; flex-direction: column;
  transition: transform .3s var(--ease), border-color .3s;
}
.venue:last-child { flex-grow: 1.22; }
.venue:hover { transform: translateY(-2px); border-color: rgba(120, 200, 255, .5); }
.venue img { width: 100%; height: 95px; object-fit: cover; display: block; }
.venue span {
  flex: 1; display: grid; place-items: center;
  padding: 0 6px; font-size: 13px; font-weight: 500; letter-spacing: -.1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.venues__empty {
  flex: 1;
  display: grid; place-items: center;
  border-radius: 10px;
  border: 1px dashed rgba(94, 170, 225, .3);
  background: rgba(8, 30, 52, .45);
  color: var(--text-dim);
  font-size: 18px;
}

/* swap animation for data blocks */
.fade-swap.is-swapping { animation: swapIn .55s var(--ease) both; }
@keyframes swapIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Region bar ---------- */
.regionbar {
  position: absolute;
  left: 34px; right: 36px; top: 985px; height: 50px;
  display: flex; gap: 10px;
}
.regionbar button {
  flex: 1 1 auto;
  height: 50px;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid rgba(90, 165, 225, .34);
  background: linear-gradient(180deg, rgba(10, 38, 66, .7), rgba(6, 26, 46, .78));
  color: #fff;
  font-size: 18px; font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color .3s, box-shadow .3s, background .3s, transform .25s var(--ease);
}
.regionbar button:hover { border-color: rgba(130, 205, 255, .7); box-shadow: 0 0 14px rgba(70, 170, 255, .25); transform: translateY(-2px); }
.regionbar button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.regionbar button.is-active {
  border: 2px solid #22d796;
  background: linear-gradient(180deg, rgba(8, 110, 78, .55), rgba(4, 64, 50, .7));
  box-shadow: 0 0 18px rgba(34, 215, 150, .45), inset 0 0 14px rgba(34, 215, 150, .18);
  font-weight: 700;
}

.credit {
  position: absolute; left: 36px; bottom: 6px; margin: 0;
  font-size: 10px; color: rgba(170, 200, 230, .35);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}


/* Full-map introduction, animated regional details and discreet orange identity accent */
.brand-logo {position:absolute;right:55px;top:32px;width:345px;z-index:35;pointer-events:none}
.brand-logo img {display:block;width:100%;height:auto;filter:brightness(0) invert(1) drop-shadow(0 3px 9px rgba(0,0,0,.28))}
.heading {z-index:12;top:65px}
.heading__title {font-size:42px}
.heading__line {background:linear-gradient(90deg,#005688 0 40%,#03a76a 40% 75%,#dc7b2c 75%)}
.bg__base {background:radial-gradient(650px 520px at 4% 30%,rgba(220,123,44,.17),transparent 76%),radial-gradient(900px 700px at 96% 85%,rgba(220,123,44,.11),transparent 76%),radial-gradient(1200px 520px at 62% 8%,rgba(30,72,120,.55),transparent 70%),linear-gradient(180deg,#0a2440 0%,#061d35 38%,#041a2e 70%,#03131f 100%)}
.map {left:480px;top:165px;transform:scale(1.37);transform-origin:50% 50%;transition:left .85s ease,top .85s ease,transform .85s ease;z-index:8}

.map-reset {position:absolute;left:75px;top:175px;z-index:40;background:rgba(220,123,44,.16);border:1px solid rgba(220,123,44,.65);border-radius:12px;color:#fff;font:600 19px var(--font);padding:11px 19px;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .4s}
.stage.has-selection .map-reset {opacity:1;visibility:visible}
.map-reset:hover {background:rgba(220,123,44,.35)}
.region:hover {stroke:#f4ae70;filter:brightness(1.2)}

.bg__terrain { opacity: .55; }
.bg__lights { opacity: .45; }
.bg__identity {
  background:
    linear-gradient(115deg, transparent 0 58%, rgba(0,173,101,.07) 70%, transparent 82%),
    radial-gradient(1000px 600px at 40% 55%, rgba(0,83,135,.35), transparent 70%);
}
.bg__vignette { background: radial-gradient(1500px 950px at 50% 45%, transparent 58%, rgba(0,10,28,.6) 100%); }
.bg__streak--orange { background: linear-gradient(90deg, rgba(223,124,46,0), rgba(255,160,70,.95) 45%, rgba(223,124,46,0)); }

/* neon identity motifs (triangles, Qassim cross, X) */
.motifs { position: absolute; inset: 0; }
.motif {
  position: absolute; fill: none; stroke-width: 1.6; stroke-linejoin: round;
  transform: rotate(var(--r));
  animation: motifFloat 9s ease-in-out infinite;
  opacity: .8;
}
.motif--c { stroke: #45e6e0; filter: drop-shadow(0 0 6px rgba(69,230,224,.8)); }
.motif--g { stroke: #2be08f; filter: drop-shadow(0 0 6px rgba(43,224,143,.8)); }
.motif--o { stroke: #ffa257; filter: drop-shadow(0 0 6px rgba(255,162,87,.85)); }
@keyframes motifFloat {
  0%, 100% { transform: translateY(0) rotate(var(--r)); opacity: .55; }
  50% { transform: translateY(-14px) rotate(calc(var(--r) + 8deg)); opacity: 1; }
}

/* logos – HRDF + Liqaat side by side */
.brands {
  position: absolute; right: 60px; top: 38px; z-index: 35;
  display: flex; align-items: center; gap: 30px; direction: rtl;
  pointer-events: none;
}
.brands__hrdf { height: 92px; width: auto; display: block; filter: brightness(0) invert(1) drop-shadow(0 3px 9px rgba(0,0,0,.28)); }
.brands__liqaat { height: 100px; width: auto; display: block; filter: drop-shadow(0 3px 10px rgba(0,0,0,.3)); }
.brands__sep { width: 2px; height: 86px; border-radius: 2px; background: linear-gradient(180deg, transparent, var(--orange) 20% 80%, transparent); }

/* intro hero title */
.hero {
  position: absolute; right: 118px; top: 300px; z-index: 12;
  text-align: right; direction: rtl;
  transition: opacity .6s var(--ease), transform .7s var(--ease), visibility .6s;
}
.hero__kicker {
  display: inline-block; padding: 7px 22px 9px; border-radius: 999px;
  background: var(--orange); color: #fff; font-size: 22px; font-weight: 700;
  box-shadow: 0 6px 22px rgba(223,124,46,.35);
}
.hero__title { margin: 18px 0 0; font-weight: 700; line-height: 1.02; font-size: 150px; }
.hero__title span { display: block; text-shadow: 0 6px 30px rgba(0,0,0,.35); }
.hero__accent {
  background: linear-gradient(90deg, #DF7C2E 0%, #2fd28a 55%, #00AD65 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: none !important; filter: drop-shadow(0 6px 24px rgba(0,0,0,.3));
  padding-bottom: 12px;
}
.hero__line { display: block; margin: 26px 0 0 auto; width: 260px; height: 5px; border-radius: 3px; background: var(--grad); box-shadow: 0 0 14px rgba(0,173,101,.45); }
.hero__sub { margin: 24px 0 0; font-size: 31px; font-weight: 400; color: var(--text-dim); }
.stage.has-selection .hero { opacity: 0; visibility: hidden; transform: translateX(40px); }

/* compact heading after a region is chosen */
.heading { left: 78px; top: 58px; opacity: 0; transform: translateY(-10px); transition: opacity .55s var(--ease) .15s, transform .55s var(--ease) .15s; }
.heading__title { font-size: 46px; }
.heading__line { margin: 16px 0 0; width: 190px; height: 4px; background: var(--grad); }
.stage.has-selection .heading { opacity: 1; transform: none; }

/* map – intro sits left of the hero title */
.map { left: 205px; top: 150px; transform: scale(1.22); }
.stage.has-selection .map { left: 100px; top: 160px; transform: scale(.94); }
.panel { z-index: 10; }
.regionbar { z-index: 20; }
.map-reset { top: 160px; background: rgba(223,124,46,.18); border-color: rgba(223,124,46,.7); }
.map-reset:hover { background: rgba(223,124,46,.4); }
.region-off {
  fill: #0a2f55; fill-opacity: .7;
  stroke: rgba(120, 190, 240, .22); stroke-width: 1; stroke-linejoin: round;
  pointer-events: none;
}
.region:hover, .region.is-hover { stroke: #ffb06a; stroke-width: 1.8; filter: brightness(1.22); }
.map-label .pin { color: #ffffff; }
.map-label.is-active .pin { color: #3dfcb4; }

/* panel + cards in identity colours */
.panel { border-color: rgba(0,173,101,.3); background: linear-gradient(180deg, rgba(4,40,78,.86), rgba(3,28,56,.92)); }
.panel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--grad); z-index: 2; }
.stat--green .stat__icon { color: #19c47e; }
.stat--green .stat__bar { background: #00AD65; box-shadow: 0 0 10px rgba(0,173,101,.75); }
.stat--blue .stat__icon { color: #3aa0ea; }
.stat--blue .stat__bar { background: #1d7fc4; box-shadow: 0 0 10px rgba(29,127,196,.75); }
.stat--orange .stat__icon { color: #f08c3c; }
.stat--orange .stat__bar { background: #DF7C2E; box-shadow: 0 0 10px rgba(223,124,46,.75); }
.sector .icon { color: #45c7e8; }
.regionbar button { font-size: 20px; }
.regionbar button.is-active { border-color: #00AD65; background: linear-gradient(180deg, rgba(0,173,101,.5), rgba(0,110,70,.65)); box-shadow: 0 0 18px rgba(0,173,101,.45), inset 0 0 14px rgba(0,173,101,.2); }
</style>
</head>
<body>
  <!-- Fixed 1920×1080 design stage, scaled to fit any 16:9 (or other) screen -->
  <div class="viewport">
    <main class="stage" id="stage">

      <!-- ===== Cinematic background ===== -->
      <div class="bg" aria-hidden="true">
        <div class="bg__base"></div>
        <div class="bg__terrain"></div>
        <canvas class="bg__lights" id="bgLights" width="1920" height="1080"></canvas>
        <div class="bg__identity"></div>
        <div class="bg__drift"></div>
        <div class="bg__streak bg__streak--orange"></div>
        <div class="bg__streak bg__streak--blue"></div>
        <div class="bg__streak bg__streak--blue2"></div>

  <script>
/* Static "night city lights" texture for the cinematic background (drawn once). */
(function () {
  const canvas = document.getElementById("bgLights");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");

  // deterministic PRNG so the screen looks identical on every load
  let seed = 20240917;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

  function cluster(cx, cy, spread, count, warm) {
    for (let i = 0; i < count; i++) {
      const a = rnd() * Math.PI * 2;
      const r = Math.pow(rnd(), 1.8) * spread;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r * 0.6;
      const s = rnd() * 1.3 + 0.3;
      const alpha = 0.25 + rnd() * 0.65;
      ctx.fillStyle = warm
        ? `rgba(255, ${170 + (rnd() * 60) | 0}, ${90 + (rnd() * 50) | 0}, ${alpha})`
        : `rgba(${150 + (rnd() * 60) | 0}, ${200 + (rnd() * 40) | 0}, 255, ${alpha * 0.8})`;
      ctx.fillRect(x, y, s, s);
    }
  }

  // faint blue "data" dust on the left side of the screen
  for (let i = 0; i < 1600; i++) {
    const x = rnd() * 1080;
    const y = 120 + rnd() * 860;
    ctx.fillStyle = `rgba(90, 170, 255, ${rnd() * 0.18})`;
    ctx.fillRect(x, y, 1, 1);
  }

  // distant towns (neighbouring land, bottom-left coast, horizon)
  cluster(60, 880, 70, 140, true);
  cluster(150, 930, 90, 160, true);
  cluster(40, 600, 60, 90, true);
  cluster(980, 210, 120, 120, true);
  cluster(1150, 225, 160, 140, true);
  cluster(1500, 215, 180, 160, true);
  cluster(1820, 230, 120, 120, true);
  cluster(120, 220, 120, 80, false);
  cluster(860, 960, 140, 120, false);

  // glow halo for the bottom-left coast
  const g = ctx.createRadialGradient(120, 860, 10, 120, 860, 260);
  g.addColorStop(0, "rgba(255,150,60,.10)");
  g.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 600, 500, 480);
})();

      <linearGradient id="gradActive" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#22d39a" stop-opacity=".92"/>
        <stop offset=".55" stop-color="#0fa877" stop-opacity=".9"/>
        <stop offset="1" stop-color="#0a7f5f" stop-opacity=".92"/>
      </linearGradient>
      <linearGradient id="gradLight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9fd8ff" stop-opacity=".10"/>
        <stop offset=".5" stop-color="#9fd8ff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000814" stop-opacity=".22"/>
      </linearGradient>
      <pattern id="patDots" width="7" height="7" patternUnits="userSpaceOnUse">
        <circle cx="1.2" cy="1.2" r=".65" fill="#8fd3ff" fill-opacity=".16"/>
      </pattern>
      <pattern id="patGrid" width="46" height="46" patternUnits="userSpaceOnUse">
        <path d="M46 0H0V46" fill="none" stroke="#7cc8ff" stroke-opacity=".07" stroke-width="1"/>
      </pattern>
      <filter id="fGlowGreen" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fGlowSky" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fBlurWide" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
      <filter id="fBlurSoft" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.4"/>
      </filter>`;

    // Silhouette = every region path, unstyled; reused for walls, glow, outline and clipping
    const sil = svgEl("g", { id: "silhouette" }, defs);
    const clip = svgEl("clipPath", { id: "clipCountry" }, defs);
    Object.keys(MAP.regions).forEach((id) => {
      const geo = MAP.regions[id];
      svgEl("path", { d: geo.d }, sil);
      svgEl("path", { d: geo.d }, clip);
    });

    // 3D extrusion (stacked silhouettes, darker toward the base)
    const walls = svgEl("g", { "aria-hidden": "true" }, svg);
    const depth = 22;
    const off = (i) => `translate(${(-i * 0.55).toFixed(2)} ${(i * 1.45).toFixed(2)})`;
    for (let i = depth; i >= 1; i--) {
      const t = i / depth;
      const c = `rgb(${Math.round(6 + 16 * (1 - t))}, ${Math.round(22 + 40 * (1 - t))}, ${Math.round(40 + 52 * (1 - t))})`;
      svgEl("use", { href: "#silhouette", transform: off(i), fill: c }, walls);
    }
    svgEl("use", {
      href: "#silhouette", transform: off(depth), fill: "none",
      stroke: "#3fb6ff", "stroke-opacity": ".35", "stroke-width": "1.2"
    }, walls);

    // Outer glow + coastline lights + bright outline (regions on top hide the inner half)
    const edge = svgEl("g", { "aria-hidden": "true" }, svg);
    svgEl("use", { href: "#silhouette", fill: "none", stroke: "#2fa8ff", "stroke-width": "14", "stroke-opacity": ".55", filter: "url(#fBlurWide)", class: "outline-pulse" }, edge);
    svgEl("use", { href: "#silhouette", fill: "none", stroke: "#ffb46a", "stroke-width": "6", "stroke-opacity": ".55", "stroke-dasharray": "1 6", "stroke-linecap": "round", filter: "url(#fBlurSoft)" }, edge);
    svgEl("use", { href: "#silhouette", fill: "none", stroke: "#8fe6ff", "stroke-width": "3.4", class: "outline-pulse" }, edge);

    // Regions without Liqaat meetings: part of the country outline only (no label, no interaction)
    const gOff = svgEl("g", { "aria-hidden": "true" }, svg);
    Object.keys(MAP.regions)
      .filter((id) => !DATA.regions[id])
      .forEach((id) => svgEl("path", { d: MAP.regions[id].d, class: "region-off" }, gOff));
    // Interactive regions
    const gRegions = svgEl("g", { class: "regions" }, svg);
    regionIds.forEach((id) => {
      const r = DATA.regions[id];
      const p = svgEl("path", {
        d: MAP.regions[id].d,
        class: "region",
        fill: REGION_TONES[id] || "#164470",
        tabindex: "0",
        role: "button",
        "aria-label": r.name,
        "data-id": id
      }, gRegions);
      refs.paths[id] = p;
    });

    // Technical texture + lighting, clipped to the country, never intercepting clicks
    const tex = svgEl("g", { "clip-path": "url(#clipCountry)", "pointer-events": "none", "aria-hidden": "true" }, svg);
    svgEl("rect", { x: vx, y: vy, width: vw, height: vh, fill: "url(#patGrid)" }, tex);
    svgEl("rect", { x: vx, y: vy, width: vw, height: vh, fill: "url(#patDots)", opacity: ".55" }, tex);
    svgEl("rect", { x: vx, y: vy, width: vw, height: vh, fill: "url(#gradLight)" }, tex);
    addCityLights(tex, vw, vh);

    // Hover + active highlight overlays
    refs.hover = svgEl("path", { class: "map-glow-hover", d: "" }, svg);
    refs.activeGlow = svgEl("path", { class: "map-glow-active", d: "" }, svg);

    // Labels (pin + name)
    const gLabels = svgEl("g", { class: "labels" }, svg);
    regionIds.forEach((id) => {
      const [x, y] = MAP.regions[id].label;
      const g = svgEl("g", { class: "map-label", "data-id": id }, gLabels);
      const pin = svgEl("g", { class: "pin" }, g);
      pin.innerHTML =
        '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" fill="rgba(4,24,44,.35)" stroke="currentColor" stroke-width="2.2"/>' +
        '<circle cx="12" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/>';
      const text = svgEl("text", { x: x, y: y + 13 }, g);
      text.textContent = DATA.regions[id].name;
      refs.labels[id] = { g, pin, text, x, y };
      placePin(id, false);
    });

    // Events (delegated)
    svg.addEventListener("click", (e) => {
      const t = e.target.closest("[data-id]");
      if (t) select(t.getAttribute("data-id"));
    });
    svg.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches(".region")) {
        e.preventDefault();
        select(e.target.getAttribute("data-id"));
      }
    });
    svg.addEventListener("pointerover", (e) => {
      const t = e.target.closest("[data-id]");
      setHover(t ? t.getAttribute("data-id") : null);
    });
    svg.addEventListener("pointerleave", () => setHover(null));
  }

  function placePin(id, active) {
    const L = refs.labels[id];
    const s = active ? 1.5 : 1;
    const tx = L.x - 12 * s;
    const ty = L.y - 6 - 22 * s;
    L.pin.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    L.text.setAttribute("y", active ? L.y + 17 : L.y + 13);
  }

  function addCityLights(parent, w, h) {
    let seed = 7331;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
    // a few warm clusters roughly at major population centres (decorative only)
    const clusters = [
      [478, 417, 26, 70], [232, 445, 22, 50], [255, 470, 14, 30], [232, 372, 16, 34],
      [770, 330, 22, 50], [740, 360, 14, 26], [385, 280, 14, 26], [362, 590, 14, 28],
      [120, 190, 10, 18], [300, 222, 10, 18], [352, 680, 10, 16], [505, 640, 10, 14]
    ];
    const g = svgEl("g", { opacity: ".75" }, parent);
    let html = "";
    clusters.forEach(([cx, cy, spread, n]) => {
      for (let i = 0; i < n; i++) {
        const a = rnd() * Math.PI * 2;
        const r = Math.pow(rnd(), 1.6) * spread;
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        const op = (0.25 + rnd() * 0.6).toFixed(2);
        html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.4 + rnd() * 0.8).toFixed(2)}" fill="#ffd29a" fill-opacity="${op}"/>`;
      }
    });
    // sparse scattered lights
    for (let i = 0; i < 260; i++) {
      html += `<circle cx="${(rnd() * w).toFixed(1)}" cy="${(rnd() * h).toFixed(1)}" r=".5" fill="#ffe0b0" fill-opacity="${(0.15 + rnd() * 0.4).toFixed(2)}"/>`;
    }
    g.innerHTML = html;
  }

  function setHover(id) {
    $$(".regionbar button").forEach((b) => b.classList.toggle("is-hover", b.dataset.id === id));
    if (!id || id === state.active) {
      refs.hover.classList.remove("is-on");
      return;
    }
    refs.hover.setAttribute("d", MAP.regions[id].d);
    refs.hover.classList.add("is-on");
  }

  /* ---------- Region bar ---------- */
  function buildRegionBar() {
    const bar = $("#regionBar");
    regionIds.forEach((id) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = id;
      b.textContent = DATA.regions[id].name;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => select(id));
      b.addEventListener("pointerenter", () => setHover(id));
      b.addEventListener("pointerleave", () => setHover(null));
      bar.appendChild(b);
      refs.buttons[id] = b;
    });
  }

  /* ---------- Panel rendering ---------- */
  function replay(el) {
    el.classList.remove("is-swapping");
    void el.offsetWidth; // restart CSS animation
    el.classList.add("is-swapping");
  }

  function countTo(el, target) {
    const prev = state.countTimers.get(el);
    if (prev) cancelAnimationFrame(prev);
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / COUNT_MS);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = numberFmt.format(Math.round(target * eased));
      if (t < 1) state.countTimers.set(el, requestAnimationFrame(step));
      else state.countTimers.delete(el);
    };
    state.countTimers.set(el, requestAnimationFrame(step));
  }

  function renderPanel(id) {
    const r = DATA.regions[id];

    const title = $("#panelTitle");
    title.textContent = r.title || "منطقة " + r.name;
    replay(title);

    const sky = $("#panelSky");
    sky.innerHTML = r.headerImage ? `<img src="${escapeHtml(r.headerImage)}" alt="">` : "";

    $$(".stat__value").forEach((el) => countTo(el, Number(r[el.dataset.key]) || 0));

    const sectors = $("#sectors");
    sectors.innerHTML = (r.sectors || [])
      .slice(0, 5)
      .map((name) => {
        const icon = (DATA.sectorIcons && DATA.sectorIcons[name]) || "sector";
        return `<div class="sector">${ICONS.svg(icon)}<span>${escapeHtml(name)}</span></div>`;
      })
      .join("");
    replay(sectors);

    const venues = $("#venues");
    const list = (r.venues || []).slice(0, 4);
    venues.innerHTML = list.length
      ? list
          .map(
            (v) =>
              `<figure class="venue" style="margin:0"><img src="${escapeHtml(v.image)}" alt="${escapeHtml(v.name)}" loading="eager"><span title="${escapeHtml(v.name)}">${escapeHtml(v.name)}</span></figure>`
          )
          .join("")
      : `<div class="venues__empty">لا توجد مواقع مضافة لهذه المنطقة</div>`;
    replay(venues);
  }

  /* ---------- Selection (shared by map + bar) ---------- */
  function select(id) {
    if (!DATA.regions[id] || (id === state.active && $("#stage").classList.contains("has-selection"))) return;
    $("#stage").classList.add("has-selection");
    const targetLabel = MAP.regions[id].label;
    const mapNode = $("#mapSvg");
    mapNode.style.transformOrigin = `${(targetLabel[0]/900*100).toFixed(1)}% ${(targetLabel[1]/739*100).toFixed(1)}%`;
    mapNode.style.transform = "scale(1.12)";
    const prev = state.active;
    state.active = id;

    if (prev) {
      refs.paths[prev].classList.remove("is-active");
      refs.labels[prev].g.classList.remove("is-active");
      placePin(prev, false);
      refs.buttons[prev].classList.remove("is-active");
      refs.buttons[prev].setAttribute("aria-pressed", "false");
    }
    refs.paths[id].classList.add("is-active");
    refs.labels[id].g.classList.add("is-active");
    // keep the active label above its neighbours
    refs.labels[id].g.parentNode.appendChild(refs.labels[id].g);
    placePin(id, true);
    refs.buttons[id].classList.add("is-active");
    refs.buttons[id].setAttribute("aria-pressed", "true");

    const glow = refs.activeGlow;
    glow.classList.remove("is-on");
    glow.setAttribute("d", MAP.regions[id].d);
    void glow.getBoundingClientRect();
    glow.classList.add("is-on");
    refs.hover.classList.remove("is-on");

    renderPanel(id);
  }

  /* ---------- Fullscreen ---------- */
  function setupFullscreen() {
    const btn = $("#fsBtn");
    const sync = () => {
      const on = !!document.fullscreenElement;
      btn.innerHTML = ICONS.svg(on ? "minimize" : "maximize");
      btn.setAttribute("aria-label", on ? "إنهاء ملء الشاشة" : "ملء الشاشة");
    };
    const toggle = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    };
    btn.addEventListener("click", toggle);
    document.addEventListener("fullscreenchange", sync);
    document.addEventListener("keydown", (e) => {
      if (e.target.closest && e.target.closest("input, textarea")) return;
      if (e.key === "f" || e.key === "F") toggle();
      // ← / → cycle through regions (presentation remote friendly)
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        const i = regionIds.indexOf(state.active);
        const d = e.key === "ArrowLeft" ? 1 : -1; // RTL: left = next
        select(regionIds[(i + d + regionIds.length) % regionIds.length]);
      }
    });
    sync();
  }

  /* ---------- Init ---------- */
  function init() {
    fitStage();
    window.addEventListener("resize", fitStage);

    $$("[data-icon]").forEach((el) => (el.innerHTML = ICONS.svg(el.dataset.icon)));
    $("#panelPin").innerHTML = ICONS.svg("pin");

    if (DATA.meta && DATA.meta.isDemo) {
      const n = $("#demoNotice");
      n.textContent = DATA.meta.demoNotice || "بيانات تجريبية";
      n.hidden = false;
    }

    buildMap();
    buildRegionBar();
    setupFullscreen();
    $("#mapReset").addEventListener("click", () => {
      $("#stage").classList.remove("has-selection");
      $("#mapSvg").style.transform = "scale(1)";
      state.active = null;
      Object.values(refs.paths).forEach(p => p.classList.remove("is-active"));
      Object.values(refs.labels).forEach(l => {l.g.classList.remove("is-active")});
      Object.values(refs.buttons).forEach(b => {b.classList.remove("is-active");b.setAttribute("aria-pressed","false")});
      refs.activeGlow.classList.remove("is-on");
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
