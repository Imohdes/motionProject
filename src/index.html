<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Graduate Development</title>
<style>
  @font-face {
    font-family: 'Cairo';
    font-weight: 900;
    src: url(./fonts/cairo-arabic-900-normal.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Cairo';
    font-weight: 800;
    src: url(./fonts/cairo-arabic-800-normal.woff2) format('woff2');
  }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #c { position: absolute; inset: 0; }
  .title {
    position: absolute; left: 0; right: 0; top: 270px;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; will-change: transform, opacity;
  }
  /* Arabic: RTL, no letter-spacing (keeps letters joined), real shaping by the browser. */
  .title .txt {
    direction: rtl; unicode-bidi: isolate;
    font-family: 'Cairo', sans-serif; font-weight: 900;
    color: #fff; line-height: 1.25; white-space: nowrap;
    letter-spacing: 0; font-feature-settings: "kern", "liga", "calt";
    text-shadow: 0 8px 36px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
    padding: 30px 40px 60px;
  }
  .title .bar {
    height: 7px; width: 170px; margin-top: -48px; border-radius: 4px;
    background: linear-gradient(to left, #f6d58e, #c9974a 70%, rgba(201,151,74,0));
    transform-origin: right center; box-shadow: 0 0 22px rgba(246,213,142,.55);
  }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="titles"></div>
  <div id="fade"></div>
</div>
<script src="./film.js"></script>
</body>
</html>
